name: CI

# Run tests on every pull request, and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        working-directory: app
        run: |
          npm install
          npm test

      - name: Smoke-test the server
        working-directory: app
        run: |
          npm start &
          SERVER_PID=$!
          for _ in $(seq 1 10); do
            curl -sf http://localhost:3000/health && break || sleep 1
          done
          curl -sf http://localhost:3000/api/v1/greet?name=CI
          echo
          kill $SERVER_PID

  package:
    # Package the app into a downloadable artifact — a pattern you will
    # meet in every real deployment pipeline.
    name: Package artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release tarball
        run: tar -czf actions-lab-api.tar.gz app/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: actions-lab-api
          path: actions-lab-api.tar.gz
          retention-days: 14
